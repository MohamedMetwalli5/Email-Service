# Datasource values are placeholders only - Testcontainers @ServiceConnection overrides them
spring.datasource.url=jdbc:mysql://localhost:3306/unused
spring.datasource.username=unused
spring.datasource.password=unused
auth.service.url=http://localhost:8082
spring.cache.type=simple
kafka.topic.email-sent=email.sent
# Redis is not exercised by MailFlowIT (spring.cache.type=simple), but the main
# application.properties references ${REDIS_HOST}/${REDIS_PORT} without defaults and
# RedisProperties binds eagerly at startup - dummy values keep the context loadable.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.username=
spring.data.redis.password=
