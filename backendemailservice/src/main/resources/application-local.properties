# Overriding only the lines that are different locally. Everything else is still read from `application.properties`.
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION'&jdbcCompliantTruncation=false
cors.allowed.origin=http://localhost:8080

# SQL logging — local dev only, never in prod (leaks emails/hashes to logs)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE