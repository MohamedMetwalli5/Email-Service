services:

  # -- MySQL Database --------------------------------
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      MAIL_DB_NAME: ${MAIL_DB_NAME}
      MAIL_DB_USER: ${MAIL_DB_USER}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Redis (refresh tokens, inbox cache) -----------
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -- Kafka (single broker, KRaft - no Zookeeper) ----
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka_broker
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # -- auth-service ----------------------------------
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MODULE: auth-service
    container_name: auth_service
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_NAME: ${AUTH_DB_NAME}
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-}
      ZIPKIN_ENDPOINT: http://zipkin:9411
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # -- mail-service ----------------------------------
  mail-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MODULE: mail-service
    container_name: mail_service
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      DB_NAME: ${MAIL_DB_NAME}
      DB_USER: ${MAIL_DB_USER}
      DB_PASSWORD: ${MAIL_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""
      AUTH_SERVICE_URL: http://auth-service:8082
      JWKS_URI: http://auth-service:8082/.well-known/jwks.json
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ZIPKIN_ENDPOINT: http://zipkin:9411
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # -- notification-service ---------------------------
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MODULE: notification-service
    container_name: notification_service
    restart: always
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      DB_NAME: ${NOTIFICATION_DB_NAME}
      DB_USER: ${NOTIFICATION_DB_USER}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWKS_URI: http://auth-service:8082/.well-known/jwks.json
      ZIPKIN_ENDPOINT: http://zipkin:9411
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # -- api-gateway (single entry point) ---------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MODULE: api-gateway
    container_name: api_gateway
    restart: always
    depends_on:
      auth-service:
        condition: service_started
      mail-service:
        condition: service_started
    environment:
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      AUTH_SERVICE_URL: http://auth-service:8082
      MAIL_SERVICE_URL: http://mail-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      ZIPKIN_ENDPOINT: http://zipkin:9411
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # -- Zipkin (distributed tracing) -------------------
  zipkin:
    image: openzipkin/zipkin-slim
    container_name: zipkin_tracing
    restart: always
    ports:
      - "9411:9411"

  # -- Prometheus (metrics) ----------------------------
  prometheus:
    image: prom/prometheus
    container_name: prometheus_metrics
    restart: always
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # -- Grafana (dashboards) ----------------------------
  grafana:
    image: grafana/grafana
    container_name: grafana_dashboards
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"

  # -- React Frontend ---------------------------------
  frontend:
    build:
      context: ./frontend-email-service
      args:
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID}
        VITE_DISCORD_REDIRECT_URI: ${VITE_DISCORD_REDIRECT_URI}
        VITE_TERMS_OF_USE_URL: ${VITE_TERMS_OF_USE_URL}
        VITE_PRIVACY_POLICY_URL: ${VITE_PRIVACY_POLICY_URL}
    container_name: react_frontend
    restart: always
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  mysql_data: